name: Build Unsigned IPA for iOS 12.5

on:
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 编译项目（跳过签名）
        run: |
          # 进入 iOS 目录，因为 .xcodeproj 在里边
          cd iOS
          
          # 编译
          xcodebuild -project LegacyPadDisplay.xcodeproj \
                     -scheme LegacyPadDisplay \
                     -configuration Release \
                     -derivedDataPath ./build_output \
                     clean build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     IPHONEOS_DEPLOYMENT_TARGET=12.5 \
                     ONLY_ACTIVE_ARCH=NO

      - name: 打包为 IPA（Payload 方式）
        run: |
          # 找到编译生成的 .app 文件
          APP_PATH=$(find ./iOS/build_output -name "*.app" -type d | head -n 1)
          echo "找到 App 路径：$APP_PATH"
          
          # 创建 Payload 文件夹并压缩
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r -q app-unsigned.ipa Payload

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-IPA
          path: app-unsigned.ipa
          retention-days: 7
